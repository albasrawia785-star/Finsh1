name: Generate NEW Keystore Base64

on:
  workflow_dispatch:

jobs:
  generate-new-key:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate Fresh Keystore and Output Base64
        run: |
          keytool -genkeypair -v \
            -keystore new_release.keystore \
            -alias saydali_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "SaydaliPass123" \
            -keypass "SaydaliPass123" \
            -dname "CN=DaftarAldeyon, OU=Dev, O=App, L=Basra, S=Basra, C=IQ" \
            -storetype PKCS12

          echo "==================== NEW KEYSTART ===================="
          base64 -w 0 new_release.keystore
          echo -e "\n==================== NEW KEYEND ===================="
