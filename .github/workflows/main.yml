name: Build and Sign Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build and Sign Release APK
        run: |
          cd android
          chmod +x gradlew

          # فك تشفير وتنظيف الـ Keystore باستخدام Python لمنع أخطاء الأسطر والمسافات
          python3 -c "
          import base64, re

          b64_data = '''
          
          '''

          clean_b64 = re.sub(r'\s+', '', b64_data)

          with open('release.keystore', 'wb') as f:
              f.write(base64.b64decode(clean_b64))
          "

          # تحديث رقم الإصدار تلقائياً
          RUN_NUM=${{ github.run_number }}
          if [ -f "app/build.gradle" ]; then
            sed -i "s/versionCode 1/versionCode $RUN_NUM/g" app/build.gradle || true
            sed -i "s/versionName \"1.0\"/versionName \"1.0.$RUN_NUM\"/g" app/build.gradle || true
          fi

          # بناء نسَخة Release غير موقعة
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.project.android.useAndroidX=true

          # العثور على أحدث أدوات Build Tools للتوقيع
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="app/build/outputs/apk/release/app-release-aligned.apk"
          
          DATE_STR=$(date +'%Y-%m-%d')
          FINAL_APK_NAME="Daftar-Aldeyon-${DATE_STR}-v${RUN_NUM}.apk"
          FINAL_APK_PATH="app/build/outputs/apk/release/${FINAL_APK_NAME}"

          # المحاذاة Zipalign
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # التوقيع الرسمي بواسطة apksigner
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks release.keystore \
            --ks-pass pass:"MyStrongPass2026" \
            --key-pass pass:"MyStrongPass2026" \
            --ks-key-alias "my_alias" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL_APK_PATH" "$ALIGNED_APK"

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Release-APK
          path: android/app/build/outputs/apk/release/Daftar-Aldeyon-*.apk
